name: MVP Demo — 运行示例分析

on:
  push:
    branches: [main]
    paths:
      - "DSA_MVP/**"
      - ".github/workflows/mvp-demo.yml"
  pull_request:
    branches: [main]
    paths:
      - "DSA_MVP/**"
      - ".github/workflows/mvp-demo.yml"
  workflow_dispatch:

concurrency:
  group: mvp-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mvp-demo:
    name: 运行 MVP 示例分析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: DSA_MVP/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r DSA_MVP/requirements.txt

      - name: 📊 运行 MVP 演示（自动 fallback 样本数据）
        run: python -m DSA_MVP.demo --output-dir reports

      - name: 📄 显示分析报告内容
        if: always()
        run: |
          if ls reports/*.md 1>/dev/null 2>&1; then
            cat reports/*.md
          else
            echo "⚠️ 未找到报告文件"
          fi

      - name: 📦 上传分析报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: 📡 运行 MVP 实时分析 (dry-run)
        run: python -m DSA_MVP --stocks 600519 --days 60 --dry-run
        continue-on-error: true
